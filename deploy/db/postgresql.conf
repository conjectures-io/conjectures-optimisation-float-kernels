# Tuned baseline for the validator's store. Sized for ~2 GB RAM and 2 vCPUs, which
# matches compose.yaml's limits and is generous for this workload: a few submissions an
# hour, a registration row only when the subnet actually changes, and one weight vector
# an epoch. Scale with the formulas below if the host differs.
#
#   shared_buffers        = 25% of RAM
#   effective_cache_size  = 75% of RAM (a planner hint, not an allocation)
#   work_mem              = (RAM * 0.25) / max_connections / 2, per sort/hash node

# --- Connections -------------------------------------------------------------
listen_addresses = '*'
port = 5432
# Four processes (api, gate worker, chain watcher, weight setter) with small pools.
max_connections = 50
superuser_reserved_connections = 3

# --- Memory ------------------------------------------------------------------
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 8MB
huge_pages = try

# --- Write-Ahead Log / Checkpoints -------------------------------------------
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_compression = on
# Durable. Entitlement claims decide who gets paid; never trade their crash-safety.
synchronous_commit = on

# --- Planner / Storage assumptions (SSD) -------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Parallelism -------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
# Every query here touches at most a few thousand rows; JIT compilation would cost
# more than the scans it speeds up.
jit = off

# --- Autovacuum --------------------------------------------------------------
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Observability -----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_io_timing = on
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '

# --- Misc --------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
