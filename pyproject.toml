# Lint and format settings for the gate's Python; dependencies live in requirements/.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The evidence report is Markdown built line by line; wrapping its table rows would hurt more than it helps.
"tools/evidence.py" = ["E501"]
# Alembic autogenerate writes long SQL constraint strings; they are compared, not hand-edited.
"deploy/migrate/alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gate lives at the root, the validator's modules under validator/; tests import both.
pythonpath = [".", "validator"]
markers = ["slow: runs the real Lean gate (minutes); deselect with -m 'not slow'"]

[tool.ruff.lint.isort]
# Imported by bare name via the pythonpath above, or by each worker's own path setup.
known-first-party = ["gate", "fingerprint", "selftest", "conftest", "admission", "axiom", "log", "reward", "treasury", "chain", "db", "service", "workers"]
